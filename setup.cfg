[metadata]
name = mathdoc
version = 0.1.0
author = Educational Contributors
author_email = contact@example.com
description = Educational project for mathematical package documentation
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/Oleg-2020/interpolation-approximation-tutorial
project_urls =
    Bug Tracker = https://github.com/Oleg-2020/interpolation-approximation-tutorial/issues
    Documentation = https://github.com/Oleg-2020/interpolation-approximation-tutorial/tree/main/docs
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages = find:
python_requires = >=3.8
install_requires =
    numpy>=1.19.0
    scipy>=1.5.0
    matplotlib>=3.3.0

[options.extras_require]
dev =
    pytest>=6.0
    pytest-cov>=2.10
    sphinx>=3.0
    sphinx-rtd-theme>=0.5

[tool:pytest]
testpaths = tests
python_files = test_*.py
addopts = -v --tb=short
